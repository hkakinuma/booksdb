name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (config.js はこのステップでだけ生成し、リポジトリには含めない)
        env:
          APP_API_URL: ${{ secrets.APP_API_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          mkdir -p dist
          cp index.html app.js robots.txt dist/
          cat > dist/config.js << EOF
          window.CONFIG = {
            API_URL: '${APP_API_URL}',
            TOKEN: '${APP_TOKEN}'
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
