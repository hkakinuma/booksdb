<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
<link rel="manifest" href="./assets/site.manifest" />
<title>蔵書管理</title>
<style>
  :root {
    --ink: #22282f;
    --ink-soft: #565f6b;
    --paper: #eee9df;
    --paper-raised: #f7f4ec;
    --rule: #c9c1ae;
    --lab: #3b6e8f;
    --lab-soft: #dde7ec;
    --home: #9c4f37;
    --home-soft: #f0ded4;
    --lent: #ad841f;
    --lent-soft: #f2e6c6;
    --danger: #a33b2e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    margin: 0;
    padding: 20px 16px 60px;
  }
  #app { max-width: 760px; margin: 0 auto; }

  .bt-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px; }
  .bt-header-right { text-align: right; }
  .bt-title { font-size: 26px; font-weight: 600; }
  .bt-count { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: var(--ink-soft); }
  .bt-last-updated { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .bt-sticky-header {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }
  .bt-toolbar {
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex; gap: 8px; padding: 12px 0;
    flex-wrap: wrap; align-items: center;
  }
  .bt-bulk-bar {
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-soft);
    padding: 0 0 10px;
  }
  .bt-bulk-count { font-weight: 600; color: var(--ink); }
  .bt-row-checkbox { width: 18px; height: 18px; flex-shrink: 0; }
  .bt-search-wrap { position: relative; flex: 1 1 220px; min-width: 0; }
  .bt-search { width: 100%; min-width: 0; padding: 9px 30px 9px 12px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper-raised); font-size: 16px; font-family: inherit; color: var(--ink); }
  .bt-search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: transparent; font-size: 18px; line-height: 1; color: var(--ink-soft); cursor: pointer; padding: 4px; }
  .bt-filters { display: flex; gap: 6px; }
  .bt-filter-btn { font-family: -apple-system, "Segoe UI", sans-serif; padding: 8px 12px; border: 1px solid var(--rule); background: var(--paper-raised); border-radius: 3px; font-size: 13px; cursor: pointer; color: var(--ink-soft); }
  .bt-filter-btn.active { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
  #bt-refresh-btn { margin-left: 14px; }
  .bt-sort-select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper-raised); font-size: 16px; font-family: inherit; color: var(--ink-soft); }
  .bt-add-btn { font-family: -apple-system, "Segoe UI", sans-serif; padding: 8px 14px; border: none; background: var(--ink); color: var(--paper-raised); border-radius: 3px; font-size: 13px; cursor: pointer; white-space: nowrap; }

  .bt-form { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 4px; padding: 16px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; scroll-margin-top: 90px; }
  .bt-form input, .bt-form select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 3px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); min-width: 0; width: 100%; }
  .bt-form textarea { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 3px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); resize: vertical; min-height: 44px; min-width: 0; width: 100%; }
  .bt-row-note { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: var(--ink-soft); margin-top: 3px; cursor: pointer; }
  .bt-row-note-toggle { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; margin-top: 3px; display: inline-block; }
  .bt-memo-toggle { text-decoration: underline; }
  .bt-full { grid-column: 1 / -1; }
  .bt-isbn-row { display: flex; gap: 6px; }
  .bt-isbn-row input { flex: 1; min-width: 0; }
  .bt-cover-row { display: flex; gap: 8px; align-items: center; }
  .bt-cover-row input { flex: 1; min-width: 0; }
  .bt-form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .bt-btn-primary { padding: 8px 14px; border: none; background: var(--lab); color: #fff; border-radius: 3px; font-size: 13px; cursor: pointer; }
  .bt-btn-ghost { padding: 8px 12px; border: 1px solid var(--rule); background: transparent; border-radius: 3px; font-size: 13px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; }

  .bt-status-info { color: var(--ink-soft); font-size: 12.5px; }
  .bt-status-ok { color: #2e6b3e; font-size: 12.5px; }
  .bt-status-warn { color: var(--danger); font-size: 12.5px; }
  .bt-dup-warning { background: var(--lent-soft); border: 1px solid var(--lent); color: #5c470f; font-size: 13px; padding: 8px 12px; border-radius: 3px; }

  .bt-group { margin-bottom: 10px; }
  .bt-group-content { display: flex; gap: 10px; align-items: flex-start; padding: 10px 4px 4px; }
  .bt-group-body { flex: 1; min-width: 0; }
  .bt-group-title { font-size: 16px; font-weight: 600; }
  .bt-group-meta { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .bt-copies { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: var(--ink-soft); font-weight: 400; margin-left: 6px; }
  .bt-group-rows { margin-top: 6px; }

  .bt-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
  .bt-thumb { width: 76px; height: 106px; object-fit: contain; border-radius: 3px; border: 1px solid var(--rule); flex-shrink: 0; background: #fff; }
  .bt-thumb-placeholder { display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .bt-row-main { flex: 1; min-width: 0; }
  .bt-row-tags { display: flex; align-items: center; gap: 6px; }
  .bt-acquisition-inline { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
  .bt-row-meta { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .bt-tag { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; padding: 3px 9px; border-radius: 2px; white-space: nowrap; font-weight: 600; }
  .bt-tag-lab { background: var(--lab-soft); color: var(--lab); }
  .bt-tag-home { background: var(--home-soft); color: var(--home); }
  .bt-tag-lent { background: var(--lent-soft); color: var(--lent); }
  .bt-tag-swap { cursor: pointer; user-select: none; }
  .bt-tag-swap:active { opacity: 0.6; }
  .bt-swap-icon { font-size: 10px; opacity: 0.75; }

  .bt-row-actions { font-family: -apple-system, "Segoe UI", sans-serif; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .bt-icon-btn { border: 1px solid var(--rule); background: var(--paper-raised); border-radius: 3px; font-size: 12px; padding: 6px 9px; cursor: pointer; color: var(--ink-soft); }
  .bt-icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .bt-empty { font-family: -apple-system, "Segoe UI", sans-serif; padding: 40px 10px; text-align: center; color: var(--ink-soft); font-size: 14px; }
  .bt-load-more { font-family: -apple-system, "Segoe UI", sans-serif; padding: 20px 10px; text-align: center; color: var(--ink-soft); font-size: 13px; }
  .bt-loading { font-family: -apple-system, "Segoe UI", sans-serif; padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13px; }
  .bt-retry-btn { margin-top: 12px; }

  .bt-login {
    font-family: -apple-system, "Segoe UI", sans-serif;
    max-width: 320px;
    margin: 15vh auto 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bt-login-title { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 24px; font-weight: 600; color: var(--ink); }
  .bt-login-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .bt-login-input { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 3px; font-size: 16px; font-family: inherit; background: var(--paper-raised); color: var(--ink); text-align: center; width: 100%; }
  .bt-logout-link { text-decoration: underline; cursor: pointer; }

  .bt-lend-form { font-family: -apple-system, "Segoe UI", sans-serif; display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .bt-lend-form input { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 3px; font-size: 16px; font-family: inherit; min-width: 0; flex: 1; }

  .bt-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .bt-modal { background: var(--paper-raised); border-radius: 6px; padding: 16px; width: 100%; max-width: 420px; font-family: -apple-system, "Segoe UI", sans-serif; }
  .bt-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
  #bt-reader { width: 100%; border-radius: 4px; overflow: hidden; background: #000; min-height: 200px; }
  #bt-reader video { width: 100%; display: block; }
  .bt-modal-hint { font-size: 12px; color: var(--ink-soft); margin-top: 8px; text-align: center; }

  @media (max-width: 480px) {
    .bt-form { grid-template-columns: 1fr; }
  }

  #bt-top-btn {
    position: fixed;
    right: 20px;
    bottom: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--ink);
    color: var(--paper-raised);
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 30;
  }
  #bt-top-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
</style>
</head>
<body>
  <div id="app"><div class="bt-loading">読み込み中…</div></div>
  <button id="bt-top-btn" aria-label="最上部へ戻る" title="最上部へ戻る">↑</button>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
